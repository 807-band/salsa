<div class="mat-elevation-z4" style="overflow-x: auto">
  <table mat-table [dataSource]="attendanceDataSource">

    <!-- Title Column -->
    <ng-container matColumnDef="event">
      <th mat-header-cell *matHeaderCellDef> Event </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.eventTitle}} </td>
    </ng-container>

    <!-- Type Column -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button [matMenuTriggerFor]="typeMenu">
          Type
          <mat-icon iconPositionEnd class="material-symbols-outlined">filter_list</mat-icon>
        </button>

        <mat-menu #typeMenu="matMenu">
          <div mat-menu-item
               *ngFor="let type of eventTypeOptions"
               (click)="$event.stopPropagation()">
            <mat-checkbox
              [checked]="selectedEventTypes.includes(type)"
              (change)="toggleEventType(type)">
              {{ type }}
            </mat-checkbox>
          </div>
        </mat-menu>
      </th>

      <td mat-cell *matCellDef="let attendance">
        {{ attendance.eventType }}
        <span *ngIf="attendance.eventPepBandId == PEP_BAND_ID_VOLUNTEER" style="color: var(--accent-color)"> (Volunteer)</span>
      </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.eventDate | date: 'M/d' }} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button [matMenuTriggerFor]="statusMenu">
          Status
          <mat-icon iconPositionEnd class="material-symbols-outlined">filter_list</mat-icon>
        </button>

        <mat-menu #statusMenu="matMenu">
          <div mat-menu-item
               *ngFor="let status of attendanceStatusOptions"
               (click)="$event.stopPropagation()">
            <mat-checkbox
              [checked]="selectedStatuses.includes(status)"
              (change)="toggleStatus(status)">
              {{ status }}
            </mat-checkbox>
          </div>
        </mat-menu>
      </th>

      <td mat-cell *matCellDef="let attendance">
        {{ attendance.attendanceStatus }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="attendanceColumns"></tr>
    <tr (click)="navigateToAttendance(row.attendanceId)" class="clickable-row" mat-row *matRowDef="let row; columns: attendanceColumns;"></tr>
  </table>
  <mat-paginator #attendancePaginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page">
  </mat-paginator>
</div>
