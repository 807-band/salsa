<div style="display: flex; justify-content: start; align-items: center; margin-bottom: 10px;">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Filter by event type</mat-label>
    <mat-select [(ngModel)]="eventTypeFilter" (selectionChange)="updateEventTypeFilter()">
      <mat-option [value]="null">--</mat-option>
      <mat-option *ngFor="let option of eventTypeOptions" [value]="option">{{option}}</mat-option>
    </mat-select>
  </mat-form-field>
</div>
<div class="mat-elevation-z4" style="overflow-x: auto">
  <table mat-table [dataSource]="attendanceDataSource">

    <!-- Title Column -->
    <ng-container matColumnDef="event">
      <th mat-header-cell *matHeaderCellDef> Event </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.eventTitle}} </td>
    </ng-container>

    <!-- Type Column -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef> Type </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.eventType}} </td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef> Date </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.eventDate | date: 'M/d' }} </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let attendance"> {{attendance.attendanceStatus}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="attendanceColumns"></tr>
    <tr (click)="navigateToAttendance(row.attendanceId)" class="clickable-row" mat-row *matRowDef="let row; columns: attendanceColumns;"></tr>
  </table>
  <mat-paginator #attendancePaginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page">
  </mat-paginator>
</div>
